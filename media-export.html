<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><style>body{margin:0;background:#000}canvas{display:block;width:576px;height:288px}</style></head>
<body>
<canvas id="frame" width="576" height="288"></canvas>
<script type="module">
const ctx=document.getElementById('frame').getContext('2d')
ctx.fillStyle='#000';ctx.fillRect(0,0,576,288);ctx.fillStyle='#33ff66';ctx.font='bold 22px monospace'
ctx.fillText('QUICK TIP',210,50);ctx.font='16px monospace'
ctx.fillText('Bill $50.00  Tip 20%',160,100);ctx.fillText('Total $60.00',200,140);ctx.fillText('Each (2): $30.00',170,180)
document.body.dataset.ready='1'
</script>
</body>
</html>
